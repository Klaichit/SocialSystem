<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #1a1a1f; font-family: 'Noto Sans Thai', 'IBM Plex Sans Thai', sans-serif; }
    a { color: #8b4dd6; } a:hover { color: #6A2DAF; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; background: #1a1a1f; color: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 104px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <img src="24sEnergy_png.png" alt="24sEnergy" style="height: 32px; width: auto; filter: brightness(0) invert(1);">
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 1.6px; color: rgba(255,255,255,0.46);">03 · 09 · 2569</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 52px 56px 0 56px;">
    <div style="display: flex;">
      <div style="background: {{accent}}; color: {{chipInk}}; font-size: 21px; font-weight: 700; letter-spacing: 0.3px; padding: 11px 22px; border-radius: 999px;">ตลาดพลังงาน</div>
    </div>

    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 168px; line-height: 1.02; letter-spacing: -6px; color: {{accent}}; margin-top: 26px;">1,000,000</div>
    <div style="font-size: 34px; font-weight: 600; color: rgba(255,255,255,0.82); margin-top: 6px;">ครัวเรือน · ภายใน 1 ปี</div>

    <h1 style="margin: 34px 0 0 0; font-size: 46px; font-weight: 700; line-height: 1.4; letter-spacing: -0.4px; color: rgba(255,255,255,0.92); text-wrap: pretty;">เป้าโซลาร์รูฟท็อปภาคประชาชนที่รัฐประกาศกับ Reuters</h1>

    <div style="display: flex; gap: 0; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.14);">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 26px 0;">
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 44px; color: #ffffff;">5 GW</div>
        <div style="font-size: 21px; font-weight: 500; color: rgba(255,255,255,0.5);">กำลังผลิตรวมตามเป้า</div>
      </div>
      <div style="width: 1px; background: rgba(255,255,255,0.14);"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 26px 0 26px 40px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 44px; color: #ffffff;">200,000</div>
        <div style="font-size: 21px; font-weight: 500; color: rgba(255,255,255,0.5);">ล้านบาท วงเงินเปลี่ยนผ่าน</div>
      </div>
    </div>
  </div>

  <div style="height: 380px; flex-shrink: 0; position: relative; overflow: hidden; background-color: #24242c; background-image: linear-gradient(135deg, rgba(106,45,175,0.5), rgba(26,26,31,0.92)), repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 26px);">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;">
      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; letter-spacing: 3px; color: rgba(255,255,255,0.42);">[ IMAGE 1080 × 380 ]</div>
      <div style="font-size: 19px; font-weight: 500; color: rgba(255,255,255,0.32);">ภาพแนวนอน · ดรอนเหนือหลังคาโรงงาน</div>
    </div>
    <div style="position: absolute; right: 24px; top: 24px; background: rgba(0,0,0,0.55); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; letter-spacing: 1.4px; padding: 10px 16px; border-radius: 999px;">MOCKUP</div>
  </div>

  <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-top: 1px solid rgba(255,255,255,0.12);">
    <div style="font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.44);">ที่มา: Reuters</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 19px; letter-spacing: 1.4px; color: rgba(255,255,255,0.36);">24senergy</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#8b4dd6","options":["#6A2DAF","#8b4dd6","#fbbf24","#10b981"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8b4dd6';
    return { accent: accent, chipInk: accent === '#fbbf24' ? '#1a1a1f' : '#ffffff' };
  }
}
</script>
</body>
</html>
