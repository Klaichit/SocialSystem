<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #1a1a1f; font-family: 'Noto Sans Thai', 'IBM Plex Sans Thai', sans-serif; }
    a { color: #8b4dd6; } a:hover { color: #6A2DAF; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; background: #1a1a1f; color: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 104px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <img src="24sEnergy_png.png" alt="24sEnergy" style="height: 32px; width: auto; filter: brightness(0) invert(1);">
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 1.6px; color: rgba(255,255,255,0.46);">03 · 09 · 2569</div>
  </div>

  <div style="height: 660px; flex-shrink: 0; position: relative; overflow: hidden; background-color: #24242c; background-image: linear-gradient(135deg, rgba(106,45,175,0.55), rgba(26,26,31,0.9)), repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 26px);">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;">
      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; letter-spacing: 3px; color: rgba(255,255,255,0.42);">[ IMAGE 1080 × 660 ]</div>
      <div style="font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.34);">วางภาพข่าวตรงนี้ — ดรอนไซต์งาน / BESS / โซลาร์ฟาร์ม</div>
    </div>
    <div style="position: absolute; left: 56px; top: 36px; display: flex; gap: 10px; align-items: center;">
      <div style="background: {{accent}}; color: {{chipInk}}; font-size: 21px; font-weight: 700; letter-spacing: 0.3px; padding: 11px 22px; border-radius: 999px;">นโยบายรัฐ</div>
      <div style="background: rgba(0,0,0,0.55); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; letter-spacing: 1.4px; padding: 12px 18px; border-radius: 999px;">MOCKUP</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 46px 56px 0 56px;">
    <div style="width: 76px; height: 6px; border-radius: 3px; background: {{accent}}; flex-shrink: 0;"></div>
    <h1 style="margin: 26px 0 0 0; font-size: 74px; font-weight: 900; line-height: 1.35; letter-spacing: -1px; color: #ffffff; text-wrap: pretty;">รัฐลุยโซลาร์รูฟท็อป 1 ล้านครัวเรือน</h1>
    <p style="margin: 22px 0 0 0; font-size: 29px; font-weight: 400; line-height: 1.6; color: rgba(255,255,255,0.6); text-wrap: pretty;">ทุ่มวงเงินเปลี่ยนผ่านพลังงาน 200,000 ล้านบาท ดันเป้า 5 GW ภายใน 1 ปี</p>
  </div>

  <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-top: 1px solid rgba(255,255,255,0.12);">
    <div style="font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.44);">ที่มา: Reuters</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 19px; letter-spacing: 1.4px; color: rgba(255,255,255,0.36);">24senergy.co.th</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6A2DAF","options":["#6A2DAF","#fbbf24","#10b981","#60a5fa"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6A2DAF';
    return { accent: accent, chipInk: accent === '#fbbf24' ? '#1a1a1f' : '#ffffff' };
  }
}
</script>
</body>
</html>
