<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <style>
    body { margin: 0; background: #1a1a1f; font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif; }
    a { color: #8b4dd6; } a:hover { color: #6A2DAF; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; background: #1a1a1f; color: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 104px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-bottom: 1px solid rgba(255,255,255,0.10);">
    <img src="24sEnergy_png.png" alt="24sEnergy" style="height: 32px; width: auto; filter: brightness(0) invert(1);">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="background: #ef4444; color: #ffffff; font-size: 18px; font-weight: 700; letter-spacing: 0.4px; padding: 7px 16px; border-radius: 6px;">ด่วน</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 1.6px; color: rgba(255,255,255,0.46);">02 · 09 · 2569</div>
    </div>
  </div>

  <div style="height: 660px; flex-shrink: 0; position: relative; overflow: hidden; background-color: #24242c; background-image: linear-gradient(135deg, rgba(217,119,6,0.5), rgba(26,26,31,0.92)), repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 26px);">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center;">
      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 22px; letter-spacing: 3px; color: rgba(255,255,255,0.42);">[ IMAGE 1080 × 660 ]</div>
      <div style="font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.34);">ช่างติดตั้งบนหลังคาโรงงาน · แสงเย็น</div>
    </div>
    <div style="position: absolute; left: 56px; top: 36px; display: flex; gap: 10px; align-items: center;">
      <div style="background: {{accent}}; color: {{chipInk}}; font-size: 21px; font-weight: 700; letter-spacing: 0.3px; padding: 11px 22px; border-radius: 999px;">Solar</div>
      <div style="background: rgba(0,0,0,0.55); color: #ffffff; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; letter-spacing: 1.4px; padding: 12px 18px; border-radius: 999px;">MOCKUP</div>
    </div>
    <div style="position: absolute; right: 56px; bottom: 36px; background: rgba(26,26,31,0.82); border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 14px 20px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
      <div style="font-size: 17px; font-weight: 500; color: rgba(255,255,255,0.55);">ปิดรับ</div>
      <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: 1px; color: {{accent}};">30 SEP</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 46px 56px 0 56px;">
    <div style="width: 76px; height: 6px; border-radius: 3px; background: {{accent}}; flex-shrink: 0;"></div>
    <h1 style="margin: 26px 0 0 0; font-size: 68px; font-weight: 700; line-height: 1.3; letter-spacing: -1px; color: #ffffff; text-wrap: pretty;">เปิดขึ้นทะเบียนผู้ติดตั้ง Solar Rooftop</h1>
    <p style="margin: 22px 0 0 0; font-size: 29px; font-weight: 400; line-height: 1.6; color: rgba(255,255,255,0.6); text-wrap: pretty;">MEA และ PEA รับขึ้นทะเบียนถึง 30 ก.ย. 2569 รองรับเฟสแรก 500,000 ครัวเรือน</p>
  </div>

  <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; border-top: 1px solid rgba(255,255,255,0.12);">
    <div style="font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.44);">ที่มา: กรมประชาสัมพันธ์</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 19px; letter-spacing: 1.4px; color: rgba(255,255,255,0.36);">24senergy.com</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#fbbf24","options":["#6A2DAF","#fbbf24","#10b981","#60a5fa"],"section":"Brand"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#fbbf24';
    return { accent: accent, chipInk: accent === '#fbbf24' ? '#1a1a1f' : '#ffffff' };
  }
}
</script>
</body>
</html>
